<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sewa Bot WhatsApp Gratis</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", "Segoe UI", sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #0f172a;
    }

    /* BACKGROUND ANIMATION */
    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .blob {
      position: absolute;
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.4;
      animation: float 12s infinite ease-in-out;
    }

    .blob:nth-child(2) {
      background: linear-gradient(135deg, #34d399, #60a5fa);
      top: 20%;
      left: 70%;
      animation-duration: 15s;
    }

    .blob:nth-child(3) {
      background: linear-gradient(135deg, #f472b6, #60a5fa);
      bottom: 10%;
      left: 20%;
      animation-duration: 18s;
    }

    @keyframes float {
      0% { transform: translate(0,0) scale(1); }
      50% { transform: translate(50px,-40px) scale(1.1); }
      100% { transform: translate(0,0) scale(1); }
    }

    /* MAIN CARD */
    .container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 600px;
      text-align: center;
      padding: 40px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      animation: fadeUp 0.8s ease;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    p {
      color: #475569;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn {
      padding: 14px 26px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-main {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      box-shadow: 0 10px 30px rgba(99,102,241,0.3);
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(99,102,241,0.4);
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.4);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-box {
      background: white;
      padding: 25px;
      border-radius: 16px;
      width: 320px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      animation: pop 0.2s ease;
    }

    .modal-box p {
      color: #475569;
      margin: 15px 0;
      font-size: 14px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn-yes {
      flex: 1;
      background: #3b82f6;
      color: white;
    }

    .btn-no {
      flex: 1;
      background: #e2e8f0;
      color: #0f172a;
    }

    /* LOADING */
    .loading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 20;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <div class="bg">
    <div class="blob" style="top:10%; left:10%;"></div>
    <div class="blob"></div>
    <div class="blob"></div>
  </div>

  <!-- CONTENT -->
  <div class="container">
    <h1>Sewa Bot WhatsApp Gratis</h1>
    <p>
      Platform modern untuk mengaktifkan bot WhatsApp secara gratis.
      Cepat, aman, dan mudah digunakan tanpa ribet.
    </p>

    <button class="btn btn-main" onclick="openModal()">
      🚀 Mulai Sekarang
    </button>
  </div>

  <!-- MODAL -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <h3>Konfirmasi</h3>
      <p>Kamu akan diarahkan ke halaman verifikasi (Safelinku).</p>

      <div class="btn-group">
        <button class="btn btn-yes" onclick="startLoading()">Lanjutkan</button>
        <button class="btn btn-no" onclick="closeModal()">Batal</button>
      </div>
    </div>
  </div>

  <!-- LOADING -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Mengarahkan...</p>
  </div>

  <script>
    const safelink = "https://sfl.gl/8W3qpI";

    function openModal() {
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    function startLoading() {
      document.getElementById("modal").style.display = "none";
      document.getElementById("loading").style.display = "flex";

      setTimeout(() => {
        window.location.href = safelink;
      }, 1800);
    }
  </script>

</body>
</html>
