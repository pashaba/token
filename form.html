<!DOCTYPE html>
<html>
<head>
  <title>Create Bot</title>
</head>
<body style="font-family:Arial;text-align:center;padding:40px">

<h2>🤖 Create Bot</h2>

<input id="phone" placeholder="628xxx"><br><br>
<input id="name" placeholder="Nama Bot"><br><br>

<button onclick="send()">Create</button>

<script>

async function send(){

  const phone = document.getElementById("phone").value
  const name = document.getElementById("name").value

  const user_id = localStorage.getItem("uid")

  await fetch("/api/add-bot",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({phone,name,user_id})
  })

  alert("Bot created!")
  location.href = "/"

}

</script>

</body>
</html>
