<!DOCTYPE html>
<html>
<head>
<title>Bot Dashboard</title>

<style>
body{
  font-family:Arial;
  background:#f3f6fb;
  margin:0;
  padding:30px;
}

.card{
  max-width:800px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:center;
}

.status{
  padding:5px 10px;
  border-radius:6px;
  font-size:12px;
}

.active{background:#d1fae5;color:#065f46;}
.pending{background:#fef3c7;color:#92400e;}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.del{background:#ef4444;color:white;}
.refresh{background:#3b82f6;color:white;margin-bottom:10px}
</style>

</head>

<body>

<div class="card">

<h2>🤖 BOT DASHBOARD</h2>

<button class="refresh" onclick="load()">Refresh</button>

<table>
<thead>
<tr>
<th>Bot</th>
<th>Number</th>
<th>Pairing Code</th>
<th>Status</th>
<th>Runtime</th>
<th>Action</th>
</tr>
</thead>

<tbody id="data"></tbody>

</table>

</div>

<script>

async function load(){

  const res = await fetch("/api/bots")
  const data = await res.json()

  document.getElementById("data").innerHTML =
    data.map(b=>`

      <tr>
        <td>${b.name || "-"}</td>
        <td>${b.phone}</td>
        <td>${b.pairing || "-"}</td>
        <td>
          <span class="status ${b.status}">
            ${b.status}
          </span>
        </td>
        <td>${b.runtime || "0s"}</td>
        <td>
          <button class="del" onclick="del('${b.id}')">
            delete
          </button>
        </td>
      </tr>

    `).join("")
}

async function del(id){
  await fetch("/api/delete-bot?id="+id)
  load()
}

load()
setInterval(load,3000)

</script>

</body>
</html>
